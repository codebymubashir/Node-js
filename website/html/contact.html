<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Chai Corner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo">Chai Corner</a>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="index.html#menu">Menu</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <main>
    <!-- Section 1: page title -->
    <section class="page-hero">
      <h1>Contact us</h1>
      <p>Questions, orders or feedback? We reply within a day.</p>
    </section>

    <!-- Section 2: contact details -->
    <section class="section">
      <h2>Find us</h2>
      <div class="menu">
        <div class="item">
          <h3>Address</h3>
          <p>Main Market, Bahawalpur</p>
        </div>
        <div class="item">
          <h3>Phone</h3>
          <p>0300 1234567</p>
        </div>
        <div class="item">
          <h3>Email</h3>
          <p>hello@chaicorner.com</p>
        </div>
      </div>
    </section>

    <!-- Section 3: message form -->
    <section class="section alt">
      <h2>Send a message</h2>
      <form class="form" action="#" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Write your message" required></textarea>

        <button type="submit" class="btn">Send message</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>Main Market, Bahawalpur | Open daily, 10 am to 11 pm</p>
    <p class="copy">&copy; 2026 Chai Corner</p>
  </footer>

</body>
</html>
